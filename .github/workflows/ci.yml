name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Test package API
        run: npm run test:package:verify

      - name: Test packed package installation
        run: npm run test:package:verify:pack

      - name: Smoke-test MCP server
        run: npm --workspace packages/mcp run smoke

      - name: Build and run product gates
        if: matrix.node-version == 24
        run: npm run check
