<html lang="en">
  <head>

    <meta name="twitter:title" content="Regex Builder | Build Regex from Examples" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Latentmachine Regex Builder",
        "url": "https://www.latentmachine.com/regex",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web browser",

          "price": "0",
          "priceCurrency": "USD"
