[project]
name = "latent-config-tools"
version = "0.4.2"
description = """
Config helpers for #ops workflows.
Built for small automation teams.
"""
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
docs = ["mkdocs"]

[tool.ruff]
line-length = 100
target-version = "py311"
